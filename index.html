<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>План недели</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f1112;
      color: #f5f6f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 900px;
      margin: 0 auto 20px;
    }
    .time-badge {
      background: #1b1f21;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      color: #58d67b;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      max-width: 900px;
      margin: 0 auto;
      background: #16191b;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.05);
      min-height: 400px;
    }
    .day-col {
      background: #1f2326;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .day-title { font-size: 11px; color: #888; text-transform: uppercase; }
    .day-num { font-size: 16px; font-weight: bold; margin: 4px 0 10px; }
    .day-col.today { border: 1px solid #58d67b; background: #1a2a20; }
    .day-col.today .day-num { color: #58d67b; }
    .tasks-list { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    .task-item {
      background: #2a2f33;
      padding: 6px;
      border-radius: 6px;
      font-size: 11px;
      border-left: 3px solid #58d67b;
      cursor: pointer;
    }
    .task-item.done { opacity: 0.4; text-decoration: line-through; }
    .task-time { font-size: 9px; color: #58d67b; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div style="font-size: 11px; color: #888; text-transform: uppercase;">Сегодня</div>
      <h1 id="week-date-heading" style="font-size: 24px;">Загрузка...</h1>
    </div>
    <div class="time-badge" id="clock-display">00:00</div>
  </div>

  <div class="grid" id="week-grid"></div>

  <script>
    function initApp() {
      // 1. Часы
      function checkTime() {
        var now = new Date();
        var h = String(now.getHours()).padStart(2, '0');
        var m = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clock-display').innerText = h + ':' + m;
      }
      checkTime();
      setInterval(checkTime, 1000);

      // 2. Дни недели
      var daysNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      var today = new Date();
      
      // Находим понедельник
      var dayOfWeek = today.getDay(); // 0 - Вс, 1 - Пн ...
      var diffToMon = (dayOfWeek === 0 ? -6 : 1 - dayOfWeek);
      var monday = new Date(today);
      monday.setDate(today.getDate() + diffToMon);

      var grid = document.getElementById('week-grid');
      grid.innerHTML = '';

      document.getElementById('week-date-heading').innerText = 'Эта неделя';

      for (var i = 0; i < 7; i++) {
        var d = new Date(monday);
        d.setDate(monday.getDate() + i);

        var isToday = d.toDateString() === today.toDateString();
        
        var col = document.createElement('div');
        col.className = 'day-col' + (isToday ? ' today' : '');
        
        col.innerHTML = 
          '<div class="day-title">' + daysNames[i] + '</div>' +
          '<div class="day-num">' + d.getDate() + '</div>' +
          '<div class="tasks-list"></div>';

        grid.appendChild(col);
      }
    }

    // Запуск строго при загрузке
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
