  <title>План</title>
<style>
:root {
  --bg: #0a0c0d;
  --text: #f5f7f5;
  --muted: #9aa3a0;
  --muted-2: #67706d;
  --glass: rgba(255,255,255,.075);
  --glass-strong: rgba(255,255,255,.105);
  --glass-soft: rgba(255,255,255,.045);
  --stroke: rgba(255,255,255,.09);
  --stroke-soft: rgba(255,255,255,.055);
  --green: #56e47c;
  --green-2: #2fbd61;
  --green-soft: rgba(86,228,124,.14);
  --green-glow: rgba(86,228,124,.20);
  --red: #ff6c6c;
  --shadow: 0 22px 55px rgba(0,0,0,.36);
  --radius-xl: 34px;
  --radius-lg: 27px;
  --radius-md: 21px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, system-ui, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); overflow-x: hidden; }
button, input { font: inherit; }
button { border: 0; color: inherit; }

body::before,
body::after {
  content: "";
  position: fixed;
  z-index: -2;
  pointer-events: none;
  border-radius: 50%;
  filter: blur(70px);
}
body::before { width: 280px; height: 280px; top: -120px; right: -70px; background: rgba(255,255,255,.045); }
body::after { width: 220px; height: 220px; left: -90px; bottom: 80px; background: rgba(86,228,124,.035); }

.app-shell {
  min-height: 100dvh;
  padding: calc(14px + var(--safe-top)) 13px calc(100px + var(--safe-bottom));
}

.topbar {
  max-width: 650px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 15px;
  padding: 4px 3px 17px;
}

.eyebrow { color: var(--muted); text-transform: uppercase; letter-spacing: .12em; font-size: 10px; font-weight: 760; }
h1, h2, p { margin: 0; }
h1 { margin-top: 5px; font-size: clamp(29px, 8vw, 40px); line-height: .98; letter-spacing: -.055em; }
h2 { margin-top: 5px; font-size: clamp(28px, 8vw, 38px); line-height: 1; letter-spacing: -.055em; }

.live-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 12px;
  border-radius: 999px;
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.055);
  backdrop-filter: blur(18px) saturate(1.3);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
  color: #dde3df;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 8px 26px rgba(0,0,0,.17), inset 0 1px 0 rgba(255,255,255,.045);
}
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(86,228,124,.08), 0 0 16px rgba(86,228,124,.35); }

.content { max-width: 650px; margin: 0 auto; }
.view { display: none; animation: viewIn .42s cubic-bezier(.2,.8,.2,1); }
.view.is-active { display: block; }
@keyframes viewIn { from { opacity: 0; transform: translateY(9px) scale(.992); } to { opacity: 1; transform: none; } }

.week-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 2px 11px; }
.week-range { color: #dde2df; font-size: 13px; font-weight: 680; letter-spacing: -.015em; }
.week-hint { color: var(--muted-2); font-size: 10px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.swipe-icon { color: var(--green); font-size: 15px; line-height: 1; }

.week-board-wrap {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-xl);
  background: linear-gradient(180deg, rgba(255,255,255,.072), rgba(255,255,255,.036));
  border: 1px solid var(--stroke);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.05);
  backdrop-filter: blur(26px) saturate(1.2);
  -webkit-backdrop-filter: blur(26px) saturate(1.2);
}
.week-board-wrap::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.035), transparent 18%, transparent 82%, rgba(255,255,255,.018));
}
.week-board { display: grid; gap: 9px; padding: 10px; }

.day-column {
  position: relative;
  overflow: hidden;
  border-radius: 27px;
  background: rgba(255,255,255,.045);
  border: 1px solid var(--stroke-soft);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.035), 0 7px 25px rgba(0,0,0,.08);
  transition: transform .35s ease, background .35s ease, border-color .35s ease;
}
.day-column.today {
  background: linear-gradient(180deg, rgba(86,228,124,.085), rgba(255,255,255,.045) 48%);
  border-color: rgba(86,228,124,.16);
}

.day-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 14px 11px;
}
.day-head-left { min-width: 0; display: flex; align-items: center; gap: 10px; }
.day-name { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .11em; font-weight: 790; }
.day-date { color: #e9eeea; font-size: 18px; font-weight: 790; letter-spacing: -.04em; }
.today .day-date { color: var(--green); }
.day-count { min-width: 29px; height: 29px; display: grid; place-items: center; padding: 0 8px; border-radius: 999px; background: rgba(255,255,255,.055); color: var(--muted); font-size: 10px; font-weight: 780; border: 1px solid rgba(255,255,255,.045); }
.day-count.all-done { color: #0b140e; background: var(--green); border-color: var(--green); box-shadow: 0 0 18px rgba(86,228,124,.16); }

.day-content { padding: 0 11px 11px; }
.task-list { position: relative; display: grid; gap: 8px; }
.task-list::before {
  content: "";
  position: absolute;
  left: 17px;
  top: 12px;
  bottom: 12px;
  width: 1px;
  background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.035));
  pointer-events: none;
}

.empty-day { padding: 13px 14px 15px 35px; color: #5f6864; font-size: 11px; }

.task-card {
  position: relative;
  min-width: 0;
  display: grid;
  grid-template-columns: 10px minmax(0,1fr);
  gap: 9px;
  padding: 11px 11px 10px 10px;
  border-radius: 23px;
  background: linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.055));
  border: 1px solid rgba(255,255,255,.07);
  box-shadow: 0 11px 24px rgba(0,0,0,.10), inset 0 1px 0 rgba(255,255,255,.045);
  backdrop-filter: blur(20px) saturate(1.25);
  -webkit-backdrop-filter: blur(20px) saturate(1.25);
  overflow: hidden;
  user-select: none;
  touch-action: pan-y;
  transition: transform .55s cubic-bezier(.18,.9,.2,1), opacity .45s ease, background .35s ease, border-color .35s ease, box-shadow .35s ease;
}
.task-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(170px 65px at 15% 0%, rgba(255,255,255,.075), transparent 70%);
  pointer-events: none;
}
.task-card.completed {
  background: linear-gradient(180deg, rgba(86,228,124,.12), rgba(86,228,124,.065));
  border-color: rgba(86,228,124,.16);
}
.task-card.completed .task-title { color: #9ccaa8; text-decoration: line-through; text-decoration-thickness: 1px; }
.task-card.completed .task-time { color: #75a984; }
.task-dot { position: relative; z-index: 1; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: rgba(255,255,255,.22); box-shadow: 0 0 0 4px rgba(255,255,255,.018); }
.task-card.completed .task-dot { background: var(--green); box-shadow: 0 0 0 4px rgba(86,228,124,.09), 0 0 13px rgba(86,228,124,.25); }
.task-main { position: relative; z-index: 1; min-width: 0; }
.task-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.task-time { color: #a5aeaa; font-size: 11px; font-weight: 720; font-variant-numeric: tabular-nums; white-space: nowrap; }
.task-status { color: var(--muted-2); font-size: 9px; font-weight: 730; text-transform: uppercase; letter-spacing: .09em; }
.task-card.completed .task-status { color: #75bd88; }
.task-title { margin-top: 4px; font-size: 14px; line-height: 1.22; font-weight: 690; letter-spacing: -.022em; overflow-wrap: anywhere; }

.swipe-wrap { position: relative; margin-top: 10px; height: 38px; border-radius: 999px; background: rgba(0,0,0,.18); border: 1px solid rgba(255,255,255,.055); overflow: hidden; }
.swipe-wrap::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .55;
  background: linear-gradient(90deg, rgba(86,228,124,.10), transparent 42%);
}
.swipe-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #737d78; font-size: 10px; font-weight: 760; letter-spacing: .04em; pointer-events: none; transition: opacity .25s ease; }
.swipe-track-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, rgba(86,228,124,.17), rgba(86,228,124,.30)); opacity: .9; pointer-events: none; transition: width .15s ease-out; }
.swipe-thumb {
  position: absolute;
  z-index: 2;
  left: 3px;
  top: 3px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 7px 16px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.09);
  color: #cbd2ce;
  font-size: 16px;
  line-height: 1;
  touch-action: none;
  transition: left .45s cubic-bezier(.16,.86,.22,1), background .3s ease, color .3s ease, box-shadow .3s ease, transform .22s ease;
}
.swipe-thumb:active { transform: scale(.96); }
.task-card.completed .swipe-wrap { background: rgba(86,228,124,.09); border-color: rgba(86,228,124,.12); }
.task-card.completed .swipe-label { color: #78b887; }
.task-card.completed .swipe-track-fill { width: 100% !important; background: linear-gradient(90deg, rgba(86,228,124,.18), rgba(86,228,124,.27)); }
.task-card.completed .swipe-thumb { left: calc(100% - 35px); background: var(--green); color: #08130b; border-color: rgba(255,255,255,.09); box-shadow: 0 6px 18px rgba(86,228,124,.20), inset 0 1px 0 rgba(255,255,255,.2); }
.task-card.swiping .swipe-thumb { transition: none; }
.task-card.swipe-complete { transform: translateX(108%); opacity: 0; }
.task-card.snap-back .swipe-thumb { transition: left .48s cubic-bezier(.16,.86,.22,1); }

.section-head { display: flex; align-items: end; justify-content: space-between; gap: 15px; margin: 10px 2px 18px; }
.tasks-head { margin-bottom: 14px; }
.task-form { display: grid; gap: 11px; }
.field {
  display: block;
  min-width: 0;
  padding: 13px 15px 14px;
  border-radius: var(--radius-lg);
  background: linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.052));
  border: 1px solid var(--stroke-soft);
  box-shadow: 0 10px 24px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.045);
  backdrop-filter: blur(22px) saturate(1.2);
  -webkit-backdrop-filter: blur(22px) saturate(1.2);
}
.field span { display: block; margin-bottom: 7px; color: var(--muted); font-size: 11px; font-weight: 650; }
.field input { width: 100%; padding: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 17px; letter-spacing: -.02em; color-scheme: dark; }
.field input::placeholder { color: #56605b; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.primary-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 16px 17px;
  border-radius: 999px;
  background: linear-gradient(180deg, #63ea84, #4fd975);
  color: #09110b;
  font-size: 14px;
  font-weight: 830;
  letter-spacing: -.02em;
  box-shadow: 0 14px 30px rgba(86,228,124,.14), inset 0 1px 0 rgba(255,255,255,.34);
  transition: transform .22s ease, filter .22s ease, box-shadow .22s ease;
}
.primary-btn:active { transform: scale(.985); filter: brightness(.97); box-shadow: 0 8px 18px rgba(86,228,124,.1); }
.btn-arrow { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 50%; background: rgba(0,0,0,.10); font-size: 16px; }
.form-note { color: var(--muted-2); font-size: 11px; line-height: 1.45; padding: 3px 4px 0; }
.quick-date-row { display: flex; gap: 8px; margin-top: 11px; overflow-x: auto; scrollbar-width: none; }
.quick-date-row::-webkit-scrollbar { display: none; }
.date-chip { padding: 10px 13px; border-radius: 999px; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.05); color: #bcc5c0; font-size: 11px; font-weight: 680; white-space: nowrap; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
.date-chip:active { transform: scale(.97); }

.stats-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 13px; }
.stats-strip > div { padding: 13px 11px; border-radius: 23px; background: rgba(255,255,255,.055); border: 1px solid var(--stroke-soft); box-shadow: inset 0 1px 0 rgba(255,255,255,.04); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
.stats-strip strong { display: block; font-size: 23px; letter-spacing: -.045em; }
.stats-strip span { display: block; margin-top: 2px; color: var(--muted-2); font-size: 10px; }
.progress-ring { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 820; color: var(--green); background: conic-gradient(var(--green) var(--progress, 0%), rgba(255,255,255,.08) 0); position: relative; box-shadow: 0 10px 26px rgba(0,0,0,.2); }
.progress-ring::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--bg); }
.progress-ring { isolation: isolate; }
.progress-ring { z-index: 0; }
.progress-ring::after { z-index: -1; }

.all-tasks { display: grid; gap: 10px; padding-bottom: 10px; }
.date-group { display: grid; gap: 8px; }
.date-group-head { display: flex; align-items: center; justify-content: space-between; padding: 7px 5px 2px; }
.date-group-head span { font-size: 11px; color: var(--muted); font-weight: 720; }
.date-group-head strong { font-size: 10px; color: var(--muted-2); }
.task-row { display: flex; align-items: center; gap: 10px; padding: 13px; border-radius: 23px; background: rgba(255,255,255,.055); border: 1px solid var(--stroke-soft); box-shadow: inset 0 1px 0 rgba(255,255,255,.04); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); transition: transform .22s ease, background .22s ease, opacity .22s ease; }
.task-row.completed { background: rgba(86,228,124,.055); border-color: rgba(86,228,124,.10); }
.row-check { width: 29px; height: 29px; border-radius: 50%; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.035); display: grid; place-items: center; flex: 0 0 auto; color: #0b120d; font-size: 12px; }
.task-row.completed .row-check { background: var(--green); border-color: var(--green); }
.row-main { min-width: 0; flex: 1; }
.row-title { font-size: 13px; font-weight: 690; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-row.completed .row-title { color: #90a197; text-decoration: line-through; }
.row-time { margin-top: 3px; color: var(--muted-2); font-size: 10px; font-variant-numeric: tabular-nums; }
.row-delete { width: 31px; height: 31px; border-radius: 50%; background: rgba(255,255,255,.045); color: #7e8783; font-size: 13px; }
.row-delete:active { transform: scale(.93); color: var(--red); }
.no-tasks { padding: 35px 15px; border-radius: 27px; background: rgba(255,255,255,.03); border: 1px solid var(--stroke-soft); text-align: center; color: var(--muted-2); font-size: 12px; }

.tabbar {
  position: fixed;
  z-index: 50;
  left: 50%;
  bottom: calc(10px + var(--safe-bottom));
  transform: translateX(-50%);
  width: min(470px, calc(100vw - 22px));
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 4px;
  padding: 7px;
  border-radius: 28px;
  background: rgba(22,24,25,.72);
  border: 1px solid rgba(255,255,255,.09);
  backdrop-filter: blur(25px) saturate(1.4);
  -webkit-backdrop-filter: blur(25px) saturate(1.4);
  box-shadow: 0 20px 50px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.07);
}
.tab { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 6px 8px; border-radius: 21px; background: transparent; color: #78827d; font-size: 9px; font-weight: 740; transition: color .24s ease, background .24s ease, transform .24s ease; }
.tab.is-active { background: rgba(255,255,255,.07); color: #edf2ee; box-shadow: inset 0 1px 0 rgba(255,255,255,.045); }
.tab:active { transform: scale(.97); }
.tab-icon { width: 21px; height: 21px; position: relative; display: block; opacity: .94; }
.icon-week::before { content:""; position:absolute; inset:3px; border:1.6px solid currentColor; border-radius:7px; }
.icon-week::after { content:""; position:absolute; left:6px; right:6px; top:9px; height:1.6px; background:currentColor; border-radius:99px; box-shadow:0 4px 0 currentColor; }
.icon-add::before { content:""; position:absolute; inset:3px; border:1.7px solid currentColor; border-radius:50%; }
.icon-add::after { content:"+"; position:absolute; inset:0; display:grid; place-items:center; font-size:18px; line-height:1; }
.icon-list::before { content:""; position:absolute; left:4px; right:3px; top:5px; height:1.7px; border-radius:99px; background:currentColor; box-shadow:0 5px 0 currentColor, 0 10px 0 currentColor; }

.toast {
  position: fixed;
  z-index: 80;
  left: 50%;
  bottom: calc(87px + var(--safe-bottom));
  transform: translate(-50%, 16px) scale(.96);
  opacity: 0;
  pointer-events: none;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 11px 14px;
  border-radius: 999px;
  background: rgba(28,37,31,.84);
  border: 1px solid rgba(86,228,124,.10);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: #dff5e5;
  box-shadow: 0 18px 42px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.05);
  font-size: 12px;
  font-weight: 730;
  transition: opacity .28s ease, transform .28s cubic-bezier(.2,.8,.25,1);
}
.toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.toast-check { width: 18px; height: 18px; display: grid; place-items: center; border-radius:50%; background:var(--green); color:#0b140d; font-size:11px; }

@media (min-width: 700px) {
  .app-shell { padding-left: 24px; padding-right: 24px; }
  .week-board { gap: 11px; padding: 12px; }
  .task-title { font-size: 15px; }
}

@media (max-width: 370px) {
  .app-shell { padding-left: 9px; padding-right: 9px; }
  .week-hint { display: none; }
  .day-head { padding-left: 12px; padding-right: 12px; }
  .day-content { padding-left: 9px; padding-right: 9px; }
  .task-card { padding-left: 9px; padding-right: 9px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div>
      <div class="eyebrow" id="todayLabel">Сегодня</div>
      <h1 id="weekTitle">Эта неделя</h1>
    </div>
    <div class="live-pill"><span class="live-dot"></span><span id="clock">--:--</span></div>
  </header>

  <main class="content">
    <section class="view is-active" data-view="week" aria-label="Неделя">
      <div class="week-meta">
        <div class="week-range" id="weekRange">—</div>
        <div class="week-hint"><span class="swipe-icon">→</span> потяните ползунок вправо</div>
      </div>
      <div class="week-board-wrap">
        <div class="week-board" id="weekBoard"></div>
      </div>
    </section>

    <section class="view" data-view="add" aria-label="Добавить задачу">
      <div class="section-head">
        <div>
          <div class="eyebrow">Новая задача</div>
          <h2>Что нужно сделать?</h2>
        </div>
      </div>
      <form id="taskForm" class="task-form">
        <label class="field">
          <span>Задача</span>
          <input id="taskTitle" type="text" maxlength="90" placeholder="Например, подготовить отчёт" autocomplete="off" required>
        </label>
        <div class="field-row">
          <label class="field"><span>Дата</span><input id="taskDate" type="date" required></label>
          <label class="field"><span>Время</span><input id="taskTime" type="time" required></label>
        </div>
        <button class="primary-btn" type="submit"><span>Добавить задачу</span><span class="btn-arrow">↗</span></button>
        <p class="form-note">Дата и время синхронизируются с системными часами устройства.</p>
      </form>
      <div class="quick-date-row">
        <button type="button" class="date-chip" data-date-offset="0">Сегодня</button>
        <button type="button" class="date-chip" data-date-offset="1">Завтра</button>
        <button type="button" class="date-chip" data-date-offset="2">Послезавтра</button>
      </div>
    </section>

    <section class="view" data-view="tasks" aria-label="Все задачи">
      <div class="section-head tasks-head">
        <div><div class="eyebrow">Все задачи</div><h2>Ваш план</h2></div>
        <div class="progress-ring" id="progressRing">0%</div>
      </div>
      <div class="stats-strip">
        <div><strong id="statTotal">0</strong><span>всего</span></div>
        <div><strong id="statDone">0</strong><span>готово</span></div>
        <div><strong id="statOpen">0</strong><span>осталось</span></div>
      </div>
      <div id="allTasks" class="all-tasks"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Навигация">
    <button class="tab is-active" data-target="week"><span class="tab-icon icon-week"></span><span>Неделя</span></button>
    <button class="tab" data-target="add"><span class="tab-icon icon-add"></span><span>Добавить</span></button>
    <button class="tab" data-target="tasks"><span class="tab-icon icon-list"></span><span>Задачи</span></button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"><span class="toast-check">✓</span><span id="toastText">Готово</span></div>
</div>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'plan-ios-v1';
  const DAY_NAMES = ['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'];
  const DAY_NAMES_LONG = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
  const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

  const state = loadState();
  let activeView = 'week';
  let toastTimer = null;
  let clockTimer = null;

  const weekBoard = $('#weekBoard');
  const allTasks = $('#allTasks');
  const taskForm = $('#taskForm');
  const taskTitle = $('#taskTitle');
  const taskDate = $('#taskDate');
  const taskTime = $('#taskTime');

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      return { tasks: Array.isArray(parsed?.tasks) ? parsed.tasks : [] };
    } catch {
      return { tasks: [] };
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function pad(n) { return String(n).padStart(2, '0'); }
  function isoDate(date) { return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`; }

  // Окно из 7 дней: сегодня + 6 следующих. Прошедшие дни не показываются.
  function startOfWeek(date) {
    const d = new Date(date);
    d.setHours(12,0,0,0);
    return d;
  }

  function addDays(date, days) {
    const d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
  }

  function formatDateLong(iso) {
    const d = new Date(`${iso}T12:00:00`);
    return `${d.getDate()} ${MONTHS[d.getMonth()]}`;
  }

  function formatHeaderDate(date) {
    return `${DAY_NAMES_LONG[(date.getDay()+6)%7]}, ${date.getDate()} ${MONTHS[date.getMonth()]}`;
  }

  function formatTime(time) { return time?.slice(0,5) || '--:--'; }
  function escapeHTML(value) { return String(value).replace(/[&<>'"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[c])); }
  function uid() { return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`; }

  function setDefaultFormDate() {
    const now = new Date();
    taskDate.value = isoDate(now);
    taskTime.value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  }

  function syncHeader() {
    const now = new Date();
    $('#todayLabel').textContent = `Сегодня · ${formatHeaderDate(now)}`;
    const start = startOfWeek(now);
    const end = addDays(start, 6);
    $('#weekRange').textContent = start.getMonth() === end.getMonth()
      ? `${start.getDate()}–${end.getDate()} ${MONTHS[end.getMonth()]}`
      : `${start.getDate()} ${MONTHS[start.getMonth()]} — ${end.getDate()} ${MONTHS[end.getMonth()]}`;
    $('#weekTitle').textContent = 'Ближайшие 7 дней';
    $('#clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  }

  function taskSort(a,b) { return `${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`); }
  function tasksForDate(iso) { return state.tasks.filter(t => t.date === iso).sort(taskSort); }

  function renderWeek() {
    const start = startOfWeek(new Date());
    const todayISO = isoDate(new Date());
    weekBoard.innerHTML = '';

    for (let i=0; i<7; i++) {
      const date = addDays(start, i);
      const iso = isoDate(date);
      const tasks = tasksForDate(iso);
      const day = document.createElement('section');
      day.className = `day-column${iso === todayISO ? ' today' : ''}`;

      const done = tasks.filter(t => t.completed).length;
      const counterText = tasks.length ? `${done}/${tasks.length}` : '—';

      day.innerHTML = `
        <div class="day-head">
          <div class="day-head-left">
            <div class="day-name">${DAY_NAMES[(date.getDay()+6)%7]}</div>
            <div class="day-date">${date.getDate()}</div>
          </div>
          <div class="day-count${tasks.length && done === tasks.length ? ' all-done' : ''}">${counterText}</div>
        </div>
        <div class="day-content"><div class="task-list"></div></div>`;

      const list = $('.task-list', day);
      if (!tasks.length) {
        list.innerHTML = '<div class="empty-day">На этот день задач нет</div>';
      } else {
        tasks.forEach(task => list.appendChild(createTaskCard(task)));
      }

      weekBoard.appendChild(day);
    }
  }

  function createTaskCard(task) {
    const card = document.createElement('article');
    card.className = `task-card${task.completed ? ' completed' : ''}`;
    card.dataset.id = task.id;
    card.innerHTML = `
      <div class="task-dot"></div>
      <div class="task-main">
        <div class="task-top">
          <div class="task-time">${escapeHTML(formatTime(task.time))}</div>
          <div class="task-status">${task.completed ? 'Выполнено' : 'Открыто'}</div>
        </div>
        <div class="task-title">${escapeHTML(task.title)}</div>
        <div class="swipe-wrap" data-swipe="${task.completed ? 'done' : 'open'}">
          <div class="swipe-track-fill"></div>
          <div class="swipe-label">${task.completed ? 'ВЫПОЛНЕНО' : 'СВАЙП ДЛЯ ВЫПОЛНЕНИЯ'}</div>
          <button class="swipe-thumb" type="button" aria-label="${task.completed ? 'Задача выполнена' : 'Выполнить задачу'}">${task.completed ? '✓' : '→'}</button>
        </div>
      </div>`;

    attachSwipe(card, task.id, task.completed);
    return card;
  }

  function attachSwipe(card, id, isCompleted) {
    const wrap = $('.swipe-wrap', card);
    const thumb = $('.swipe-thumb', card);
    const fill = $('.swipe-track-fill', card);
    const label = $('.swipe-label', card);
    let startX = 0;
    let thumbStart = 0;
    let current = 0;
    let active = false;
    let pointerId = null;
    let moved = false;

    const maxTravel = () => Math.max(1, wrap.clientWidth - thumb.offsetWidth - 6);

    const renderPosition = x => {
      const max = maxTravel();
      current = Math.max(0, Math.min(max, x));
      thumb.style.left = `${3 + current}px`;
      fill.style.width = `${Math.min(100, ((current + thumb.offsetWidth) / wrap.clientWidth) * 100)}%`;
      label.style.opacity = current > max * .28 ? '0' : '1';
    };

    const finish = (commit = true) => {
      if (!active) return;
      active = false;
      card.classList.remove('swiping');
      thumb.releasePointerCapture?.(pointerId);
      const max = maxTravel();
      const progress = current / max;
      if (commit && progress > .70) {
        if (isCompleted) {
          thumb.style.left = '3px';
          fill.style.width = '0%';
          label.style.opacity = '1';
          setTimeout(() => setCompleted(id, false, 'Задача снова открыта'), 120);
        } else {
          thumb.style.left = `${3 + max}px`;
          fill.style.width = '100%';
          label.style.opacity = '0';
          setTimeout(() => {
            card.classList.add('swipe-complete');
            setTimeout(() => setCompleted(id, true, 'Задача выполнена'), 310);
          }, 140);
        }
      } else {
        thumb.style.left = '3px';
        fill.style.width = '0%';
        label.style.opacity = '1';
      }
    };

    thumb.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      active = true;
      moved = false;
      pointerId = e.pointerId;
      startX = e.clientX;
      thumbStart = isCompleted ? 0 : current;
      card.classList.add('swiping');
      thumb.setPointerCapture?.(pointerId);
    });

    thumb.addEventListener('pointermove', e => {
      if (!active) return;
      const delta = e.clientX - startX;
      if (Math.abs(delta) > 4) moved = true;
      const max = maxTravel();
      const x = isCompleted ? delta : thumbStart + delta;
      renderPosition(x);
    });

    thumb.addEventListener('pointerup', () => finish(true));
    thumb.addEventListener('pointercancel', () => finish(false));
    thumb.addEventListener('lostpointercapture', () => finish(true));

    thumb.addEventListener('click', e => {
      if (moved) { e.preventDefault(); e.stopPropagation(); }
    });

    // Completed tasks begin with the thumb at the end.
    if (isCompleted) {
      requestAnimationFrame(() => renderPosition(maxTravel()));
    }
  }

  function renderAllTasks() {
    allTasks.innerHTML = '';
    const sorted = [...state.tasks].sort(taskSort);
    if (!sorted.length) {
      allTasks.innerHTML = '<div class="no-tasks">Здесь появятся ваши задачи.<br>Добавьте первую через раздел «Добавить».</div>';
      updateStats();
      return;
    }

    const groups = new Map();
    sorted.forEach(task => {
      if (!groups.has(task.date)) groups.set(task.date, []);
      groups.get(task.date).push(task);
    });

    const today = isoDate(new Date());
    groups.forEach((tasks,date) => {
      const group = document.createElement('div');
      group.className = 'date-group';
      const label = date === today ? 'Сегодня' : formatDateLong(date);
      const done = tasks.filter(t => t.completed).length;
      group.innerHTML = `<div class="date-group-head"><span>${escapeHTML(label)}</span><strong>${done}/${tasks.length}</strong></div>`;
      tasks.forEach(task => group.appendChild(createTaskRow(task)));
      allTasks.appendChild(group);
    });
    updateStats();
  }

  function createTaskRow(task) {
    const row = document.createElement('div');
    row.className = `task-row${task.completed ? ' completed' : ''}`;
    row.dataset.id = task.id;
    row.innerHTML = `
      <button class="row-check" aria-label="${task.completed ? 'Отметить как невыполненную' : 'Отметить выполненной'}">${task.completed ? '✓' : ''}</button>
      <div class="row-main"><div class="row-title">${escapeHTML(task.title)}</div><div class="row-time">${escapeHTML(formatTime(task.time))}</div></div>
      <button class="row-delete" aria-label="Удалить задачу">×</button>`;
    $('.row-check',row).addEventListener('click', () => setCompleted(task.id, !task.completed, task.completed ? 'Задача снова открыта' : 'Задача выполнена'));
    $('.row-delete',row).addEventListener('click', () => deleteTask(task.id));
    return row;
  }

  function updateStats() {
    const total = state.tasks.length;
    const done = state.tasks.filter(t => t.completed).length;
    const percent = total ? Math.round(done/total*100) : 0;
    $('#statTotal').textContent = total;
    $('#statDone').textContent = done;
    $('#statOpen').textContent = total - done;
    const ring = $('#progressRing');
    ring.style.setProperty('--progress', `${percent}%`);
    ring.textContent = `${percent}%`;
  }

  function setCompleted(id, completed, toastText = '') {
    const task = state.tasks.find(t => t.id === id);
    if (!task) return;
    task.completed = Boolean(completed);
    task.completedAt = task.completed ? new Date().toISOString() : null;
    saveState();
    renderWeek();
    renderAllTasks();
    if (toastText) showToast(toastText);
  }

  function deleteTask(id) {
    if (!state.tasks.some(t => t.id === id)) return;
    state.tasks = state.tasks.filter(t => t.id !== id);
    saveState();
    renderWeek();
    renderAllTasks();
    showToast('Задача удалена');
  }

  function addTask(title,date,time) {
    state.tasks.push({ id:uid(), title:title.trim(), date, time, completed:false, completedAt:null, createdAt:new Date().toISOString() });
    saveState();
    renderWeek();
    renderAllTasks();
    showToast('Задача добавлена');
    switchView('week');
  }

  function showToast(message) {
    const toast = $('#toast');
    $('#toastText').textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1900);
  }

  function switchView(target) {
    activeView = target;
    $$('.tab').forEach(tab => tab.classList.toggle('is-active', tab.dataset.target === target));
    $$('.view').forEach(view => view.classList.toggle('is-active', view.dataset.view === target));
    if (target === 'week') renderWeek();
    if (target === 'tasks') renderAllTasks();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  $$('.tab').forEach(tab => tab.addEventListener('click', () => switchView(tab.dataset.target)));

  taskForm.addEventListener('submit', e => {
    e.preventDefault();
    if (!taskTitle.value.trim() || !taskDate.value || !taskTime.value) return;
    const title = taskTitle.value;
    const date = taskDate.value;
    const time = taskTime.value;
    addTask(title,date,time);
    taskTitle.value = '';
    setDefaultFormDate();
  });

  $$('.date-chip').forEach(btn => btn.addEventListener('click', () => {
    const date = addDays(new Date(), Number(btn.dataset.dateOffset || 0));
    const now = new Date();
    taskDate.value = isoDate(date);
    taskTime.value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    taskTitle.focus({preventScroll:true});
  }));

  let renderedDay = isoDate(new Date());

  function tick() {
    syncHeader();
    const nowDay = isoDate(new Date());
    if (nowDay !== renderedDay) {
      renderedDay = nowDay;
      renderWeek();
      renderAllTasks();
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      syncHeader();
      renderedDay = isoDate(new Date());
      if (activeView === 'week') renderWeek();
    }
  });

  syncHeader();
  setDefaultFormDate();
  renderWeek();
  renderAllTasks();
  clockTimer = setInterval(tick, 15000);
})();
</script>
</body>
</html>
